version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:15
    environment:
      POSTGRES_DB: flyrain_kb
      POSTGRES_USER: flyrain
      POSTGRES_PASSWORD: flyrain123
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flyrain"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
    env_file: ../backend/.env.example
    environment:
      - DJANGO_SETTINGS_MODULE=flyrain_kb.settings.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media

  frontend:
    build:
      context: ../frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

  worker:
    build:
      context: ../backend
    command: celery -A celery_app worker -l info
    env_file: ../backend/.env.example
    environment:
      - DJANGO_SETTINGS_MODULE=flyrain_kb.settings.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - media:/app/media

volumes:
  pgdata:
  media:
