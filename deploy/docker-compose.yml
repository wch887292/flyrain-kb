# ============================================================
#  FHZSK (MaxKB复刻) - Docker Compose
#  用法: cd deploy && docker compose up -d --build
# ============================================================

services:
  postgres:
    image: pgvector/pgvector:15
    container_name: FHZSK-postgres
    env_file: ../backend/.env
    environment:
      POSTGRES_DB: ${DB_NAME:-fhzsk}
      POSTGRES_USER: ${DB_USER:-FHZSK}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-FHZSK123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U FHZSK"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dev-network

  redis:
    image: redis:7-alpine
    container_name: FHZSK-redis
    ports:
      - "6381:6379"
    networks:
      - dev-network

  backend:
    build:
      context: ../backend
    container_name: FHZSK-backend
    env_file: ../backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=fhzsk.settings.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    networks:
      - dev-network

  frontend:
    build:
      context: ../frontend
    container_name: FHZSK-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - dev-network

  worker:
    build:
      context: ../backend
    container_name: FHZSK-worker
    command: celery -A celery_app worker -l info
    env_file: ../backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=fhzsk.settings.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - media:/app/media
    networks:
      - dev-network

volumes:
  pgdata:
  media:

networks:
  dev-network:
    driver: bridge
